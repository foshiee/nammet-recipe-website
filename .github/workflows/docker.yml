# Tests the service, the Docker image and install.sh on every pull request and push to
# master. A v* tag also publishes the image to ghcr.io/foshiee/nomnoms-recipe-website.
name: Docker image and installer

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/foshiee/nomnoms-recipe-website

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck install.sh docker/*.sh docker/add-user
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Service tests
        working-directory: opt/nomnoms-api
        run: npm ci && npm test

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nomnoms:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start
        run: |
          docker run -d --name nomnoms -p 8080:80 -e COOKIE_SECURE=false \
            -v recipes:/var/www/nomnoms/recipes -v photos:/var/www/nomnoms/photos -v data:/var/lib/nomnoms nomnoms:test
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/api/me && break; sleep 1; done
          printf 'Smoke-test-pass-1\n' | docker exec -i nomnoms add-user smoketest
      - name: Smoke test
        env:
          SMOKE_USER: smoketest
          SMOKE_PASSWORD: Smoke-test-pass-1
        run: sh docker/smoke-test.sh http://127.0.0.1:8080
      - name: Restart keeps users, and stops promptly
        env:
          SMOKE_USER: smoketest
          SMOKE_PASSWORD: Smoke-test-pass-1
        run: |
          start=$(date +%s)
          docker stop nomnoms
          took=$(( $(date +%s) - start ))
          echo "docker stop took ${took}s"
          [ "$took" -lt 8 ]
          docker start nomnoms
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/api/me && break; sleep 1; done
          sh docker/smoke-test.sh http://127.0.0.1:8080
      - name: REAL_IP_FROM renders a valid config
        run: |
          docker run -d --name nomnoms-proxy -p 8081:80 -e REAL_IP_FROM='10.0.0.0/8, fd00::/8' nomnoms:test
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8081/api/me && break; sleep 1; done
          docker exec nomnoms-proxy grep -E '^\s*(set_real_ip_from|real_ip_)' /etc/nginx/http.d/nomnoms.conf
          docker exec nomnoms-proxy grep -q 'set_real_ip_from fd00::/8;' /etc/nginx/http.d/nomnoms.conf
          docker exec nomnoms-proxy nginx -t
      - name: Logs
        if: always()
        run: docker logs nomnoms || true

  install-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: ./install.sh --yes --no-admin --proxy 127.0.0.1
      - name: Create a test user
        run: |
          cd /opt/nomnoms-api
          printf 'Smoke-test-pass-1\n' | sudo -u nomnoms USERS_FILE=/var/lib/nomnoms/users.json node tools/add-user.js smoketest --role admin
      - name: Smoke test
        env:
          SMOKE_USER: smoketest
          SMOKE_PASSWORD: Smoke-test-pass-1
        run: sh docker/smoke-test.sh http://127.0.0.1
      - name: Running it again keeps the settings
        env:
          SMOKE_USER: smoketest
          SMOKE_PASSWORD: Smoke-test-pass-1
        run: |
          before=$(sudo sha256sum /etc/nomnoms/api.env /var/lib/nomnoms/users.json)
          ./install.sh --yes
          after=$(sudo sha256sum /etc/nomnoms/api.env /var/lib/nomnoms/users.json)
          [ "$before" = "$after" ]
          grep -q '^    set_real_ip_from 127.0.0.1;' /etc/nginx/conf.d/nomnoms.conf
          grep -q '^    real_ip_header X-Forwarded-For;' /etc/nginx/conf.d/nomnoms.conf
          sh docker/smoke-test.sh http://127.0.0.1
      - name: Logs
        if: always()
        run: sudo journalctl -u nomnoms-api --no-pager || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test, image, install-ubuntu]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
