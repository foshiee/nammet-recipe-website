# Save as /etc/nginx/conf.d/nammet.conf on the recipe VM

# Crawlers that collect pages for AI training or AI answers, plus common scraping
# libraries. They get a 403 everywhere. robots.txt asks the same politely; this
# catches the ones that ignore it but still say who they are.
map $http_user_agent $blocked_bot {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|CCBot|Google-Extended|Applebot-Extended|PerplexityBot|Perplexity-User|Bytespider|Meta-ExternalAgent|Meta-ExternalFetcher|FacebookBot|Amazonbot|cohere-ai|Diffbot|ImagesiftBot|Omgilibot|Timpibot|YouBot|python-requests|python-urllib|aiohttp|httpx|Scrapy|Go-http-client|node-fetch|axios) 1;
}

# Requests for recipe files, per client IP. Opening the site fetches every recipe at
# once, so the burst must stay above the number of recipes; the steady rate then slows
# anyone downloading the collection over and over. Needs the real-IP lines below
# filled in, or every visitor shares one limit.
limit_req_zone $binary_remote_addr zone=recipes:10m rate=2r/s;

# Recipe photos, per client IP. The home page loads its thumbnails as they scroll into view.
limit_req_zone $binary_remote_addr zone=photos:10m rate=2r/s;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/nammet;
    index index.html;

    # If traffic arrives through reverse proxy [Traefik], then without this every 
    # request appears to come from Traefik's address and the login rate limit can't
    # tell visitors apart.
    # Replace the address with the reverse proxy's IP or subnet, then uncomment. Only that
    # address is trusted, so visitors can't fake their IP with their own header.
    # set_real_ip_from 192.0.2.10;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # If Cloudflare is in front of the site or reverse proxy, trust its ranges too, 
    # or every visitor shows up as a Cloudflare address. 
    # Generate the file first (see the security checklist in docs/install.md), then uncomment.
    # It must stay inside this server block: listing addresses here hides any set at the http level.
    # include /etc/nginx/cloudflare-ips.inc;

    if ($blocked_bot) {
        return 403;
    }

    # The site itself: always revalidate so edits show up straight away
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Recipe files: nginx lists the folder as JSON, so any new .json file appears on the site
    location /recipes/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
        limit_req zone=recipes burst=200 nodelay;
        limit_req_status 429;
    }

    # Recipe photos. The service names each upload after its content, so a changed photo
    # gets a new address and browsers can keep the old one for a day. No folder listing.
    location /photos/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        limit_req zone=photos burst=100 nodelay;
        limit_req_status 429;
    }

    # Login and recipe import service (/opt/nammet-api, see docs/install.md)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
        proxy_read_timeout 120s;   # reading a PDF or photo with Claude can take a while
        proxy_request_buffering on;
    }
}
