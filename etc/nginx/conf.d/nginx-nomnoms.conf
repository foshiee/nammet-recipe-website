# Save as /etc/nginx/conf.d/nomnoms.conf on the recipe VM
server {
    listen 80 default_server;
    server_name _;
    root /var/www/nomnoms;
    index index.html;

    # Traffic arrives through Traefik, so without this every request appears to come
    # from Traefik's address and the login rate limit can't tell visitors apart.
    # Replace the address with Traefik's IP or subnet, then uncomment. Only that
    # address is trusted, so visitors can't fake their IP with their own header.
    # set_real_ip_from 192.0.2.10;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # The site itself: always revalidate so edits show up straight away
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Recipe files: nginx lists the folder as JSON, so any new .json file appears on the site
    location /recipes/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }

    # Login and recipe import service (/opt/nomnoms-api, see docs/import-setup.md)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
        proxy_read_timeout 120s;   # reading a PDF or photo with Claude can take a while
        proxy_request_buffering on;
    }
}
