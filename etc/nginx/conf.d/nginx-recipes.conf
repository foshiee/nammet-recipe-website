# Save as /etc/nginx/conf.d/recipes.conf on the recipe VM
server {
    listen 80 default_server;
    server_name _;
    root /var/www/recipes;
    index index.html;

    # The site itself: always revalidate so edits show up straight away
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Recipe files: nginx lists the folder as JSON, so any new .json file appears on the site
    location /recipes/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
}
