<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 340" role="img" aria-labelledby="t d">
  <title id="t">Request flow and what the import service writes</title>
  <desc id="d">A browser connects over HTTPS to a reverse proxy, which forwards over HTTP to nginx on port 80. nginx serves the static site from /var/www/nomnoms and proxies /api/ to the nomnoms-api Node service on 127.0.0.1:3000. That service reads and writes users.json and settings.json in /var/lib/nomnoms, writes recipe files, photos and the theme folder under /var/www/nomnoms, and calls api.anthropic.com only when needed.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; fill: #e2e8f0; }
    .sub { font-size: 12.5px; fill: #94a3b8; }
    .lbl { font-size: 12.5px; fill: #94a3b8; }
    .box { fill: #1e293b; stroke: #64748b; stroke-width: 1.5; }
    .core { fill: #1e3a5f; stroke: #60a5fa; stroke-width: 1.5; }
    .store { fill: #14352a; stroke: #34d399; stroke-width: 1.5; }
    .ext { fill: #3b2a0b; stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { fill: none; stroke: #94a3b8; stroke-width: 1.8; }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .head { fill: #94a3b8; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <!-- Request path -->
  <rect class="box" x="20" y="168" width="110" height="56" rx="10"/>
  <text x="75" y="201" text-anchor="middle">Browser</text>

  <path class="line" d="M130,196 H168" marker-end="url(#a)"/>
  <text class="lbl" x="149" y="186" text-anchor="middle">HTTPS</text>

  <rect class="box" x="170" y="168" width="140" height="56" rx="10"/>
  <text x="240" y="193" text-anchor="middle">Reverse proxy</text>
  <text class="sub" x="240" y="211" text-anchor="middle">Traefik</text>

  <path class="line" d="M310,196 H358" marker-end="url(#a)"/>
  <text class="lbl" x="334" y="186" text-anchor="middle">HTTP</text>

  <rect class="core" x="360" y="168" width="110" height="56" rx="10"/>
  <text x="415" y="193" text-anchor="middle">nginx</text>
  <text class="sub" x="415" y="211" text-anchor="middle">port 80</text>

  <!-- nginx branches -->
  <path class="line" d="M470,196 H505 V88 H538" marker-end="url(#a)"/>
  <path class="line" d="M470,196 H538" marker-end="url(#a)"/>
  <text class="lbl" x="508" y="80">/</text>
  <text class="lbl" x="504" y="216" text-anchor="middle">/api/</text>

  <rect class="box" x="540" y="56" width="220" height="64" rx="10"/>
  <text x="650" y="84" text-anchor="middle">Static site</text>
  <text class="sub" x="650" y="104" text-anchor="middle">/var/www/nomnoms</text>

  <rect class="core" x="540" y="164" width="220" height="64" rx="10"/>
  <text x="650" y="192" text-anchor="middle">nomnoms-api (Node)</text>
  <text class="sub" x="650" y="212" text-anchor="middle">127.0.0.1:3000 only</text>

  <!-- Service outputs -->
  <path class="line" d="M760,196 H795 M795,52 V284"/>
  <path class="line" d="M795,52 H828" marker-end="url(#a)"/>
  <path class="line" d="M795,108 H828" marker-end="url(#a)"/>
  <path class="line" d="M795,164 H828" marker-end="url(#a)"/>
  <path class="line" d="M795,220 H828" marker-end="url(#a)"/>
  <path class="dash" d="M795,284 H828" marker-end="url(#a)"/>

  <rect class="store" x="830" y="30" width="240" height="44" rx="10"/>
  <text x="950" y="50" text-anchor="middle">users.json, settings.json</text>
  <text class="sub" x="950" y="66" text-anchor="middle">/var/lib/nomnoms</text>

  <rect class="store" x="830" y="86" width="240" height="44" rx="10"/>
  <text x="950" y="106" text-anchor="middle">recipes/&lt;name&gt;.json</text>
  <text class="sub" x="950" y="122" text-anchor="middle">/var/www/nomnoms</text>

  <rect class="store" x="830" y="142" width="240" height="44" rx="10"/>
  <text x="950" y="162" text-anchor="middle">photos/&lt;name&gt;-&lt;hash&gt;.jpg</text>
  <text class="sub" x="950" y="178" text-anchor="middle">/var/www/nomnoms</text>

  <rect class="store" x="830" y="198" width="240" height="44" rx="10"/>
  <text x="950" y="218" text-anchor="middle">theme/</text>
  <text class="sub" x="950" y="234" text-anchor="middle">theme.css, site.json, favicon</text>

  <rect class="ext" x="830" y="262" width="240" height="44" rx="10"/>
  <text x="950" y="282" text-anchor="middle">api.anthropic.com</text>
  <text class="sub" x="950" y="298" text-anchor="middle">only when needed</text>
</svg>
