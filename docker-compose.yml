# docker compose up -d, then create the first admin:
#   docker compose exec nammet add-user yourname --role admin
# See docs/docker.md.
services:
  nammet:
    image: ghcr.io/foshiee/nammet-recipe-website:latest
    # build: .
    container_name: nammet
    ports:
      - "8080:80"
    volumes:
      - recipes:/var/www/nammet/recipes
      - photos:/var/www/nammet/photos
      - data:/var/lib/nammet
    restart: unless-stopped
    # environment:
    #   ANTHROPIC_API_KEY: ""            # or add the key on the admin page
    #   MODEL: claude-sonnet-5-5
    #   REAL_IP_FROM: 172.18.0.0/16      # the reverse proxy's address or subnet
    #   COOKIE_SECURE: "false"           # only for trying it locally over plain http

volumes:
  recipes:
  photos:
  data:
