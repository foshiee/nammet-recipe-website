<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2447b8">
  <title>Recipes</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍲%3C/text%3E%3C/svg%3E">
  <!-- Applies the saved light/dark choice before the page paints; app.js draws the toggle -->
  <script>try{var t=localStorage.getItem('recipes:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <!-- Written by the admin page (opt/nomnoms-api/settings.js); overrides the variables in style.css -->
  <link id="theme-css" rel="stylesheet" href="theme/theme.css">
</head>
<body>
  <main id="app" class="page">
    <p class="status">Loading recipes…</p>
  </main>
  <button id="theme-toggle" class="theme-toggle" type="button" hidden></button>
  <footer class="site-foot">
    <span id="account-foot"></span>
    <span class="credit">Made by <a href="https://github.com/foshiee" rel="noopener">foshiee</a> · <a href="https://github.com/foshiee/nomnoms-recipe-website" rel="noopener">GitHub</a> · <a href="https://ko-fi.com/foshiee" rel="noopener">Buy foshiee a pint🍺</a></span>
  </footer>
  <noscript>
    <p class="page status">This recipe site needs JavaScript to show recipes.</p>
  </noscript>
  <script src="app.js" defer></script>
</body>
</html>
