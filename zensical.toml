[project]
site_name = "Nomnoms Recipe Website"
site_description = "A self-hosted recipe website: plain JSON recipes, a vanilla JavaScript front end and nginx."
site_url = "https://foshiee.github.io/nomnoms-recipe-website/"
repo_url = "https://github.com/foshiee/nomnoms-recipe-website"
docs_dir = "docs"
site_dir = "site"

# Keep this list in step with the files in docs/ (see CLAUDE.md).
nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Docker" = "docker.md" },
  { "Using the service" = "using-the-service.md" },
  { "Recipe format" = "recipe-format.md" },
]

# Follow the system colour scheme, with a toggle that cycles
# System -> Light -> Dark like the site's own button.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
